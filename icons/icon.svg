<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18382c"/>
      <stop offset="100%" stop-color="#0b1814"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e4a2"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa8822"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.8"/>
  
  <!-- D20 Shape -->
  <g filter="url(#glow)">
    <polygon points="256,76 416,168 416,344 256,436 96,344 96,168" fill="#132a21" stroke="url(#gold)" stroke-width="8"/>
    <!-- Inner Facets -->
    <polygon points="256,76 256,236 96,168" fill="#1a382d" stroke="url(#gold)" stroke-width="4"/>
    <polygon points="256,76 416,168 256,236" fill="#1f4437" stroke="url(#gold)" stroke-width="4"/>
    <polygon points="96,168 256,236 176,380" fill="#152e24" stroke="url(#gold)" stroke-width="4"/>
    <polygon points="416,168 336,380 256,236" fill="#1d4034" stroke="url(#gold)" stroke-width="4"/>
    <polygon points="256,236 336,380 176,380" fill="#244d3f" stroke="url(#gold)" stroke-width="4"/>
    <polygon points="176,380 256,436 96,344" fill="#0e2019" stroke="url(#gold)" stroke-width="4"/>
    <polygon points="336,380 416,344 256,436" fill="#11251d" stroke="url(#gold)" stroke-width="4"/>
    <polygon points="176,380 336,380 256,436" fill="#163127" stroke="url(#gold)" stroke-width="4"/>
  </g>

  <!-- Central D20 20 Symbol / Sylvanus Leaf & Number -->
  <text x="256" y="330" font-family="'Cinzel', Georgia, serif" font-size="95" font-weight="900" fill="url(#gold)" text-anchor="middle" filter="url(#glow)">20</text>
</svg>
